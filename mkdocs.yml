site_name: Flying Navigation System
site_description: A plugin for Unreal Engine to enable complex flying AI behavior
site_url: https://blendersleuth.github.io/FlyingNavSystemSite/
repo_url: https://github.com/BlenderSleuth/FlyingNavSystemSite

nav:
  - Home: index.md
  - Quick Start: start.md
  - Usage: usage.md
  - Benchmarks: benchmarks.md
  - Troubleshooting: troubleshooting.md
  - Showcase: showcase.md
  - License & Credits: license.md

theme:
  name: material
  favicon: images/favicon.ico
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
